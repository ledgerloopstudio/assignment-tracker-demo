<script id="engine">
/* ===== ENGINE: pure functions, no DOM. Unit-testable in plain Node. ===== */

var GRADE_POINTS = {
  "A+": 4.0, "A": 4.0, "A-": 3.7,
  "B+": 3.3, "B": 3.0, "B-": 2.7,
  "C+": 2.3, "C": 2.0, "C-": 1.7,
  "D+": 1.3, "D": 1.0, "D-": 0.7,
  "F": 0.0
};

function parseISO(s) {
  if (!s) return null;
  var p = String(s).split("-");
  if (p.length !== 3) return null;
  var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  return isNaN(d.getTime()) ? null : d;
}

function toISO(d) {
  if (!d) return "";
  var m = String(d.getMonth() + 1);
  var day = String(d.getDate());
  if (m.length < 2) m = "0" + m;
  if (day.length < 2) day = "0" + day;
  return d.getFullYear() + "-" + m + "-" + day;
}

function daysUntil(fromISO, targetISO) {
  var a = parseISO(fromISO), b = parseISO(targetISO);
  if (!a || !b) return null;
  return Math.round((b - a) / 86400000);
}

/* overdue | due-today | urgent (<=3d) | soon (<=10d) | later | none */
function urgency(fromISO, dueISO) {
  var d = daysUntil(fromISO, dueISO);
  if (d === null) return "none";
  if (d < 0) return "overdue";
  if (d === 0) return "due-today";
  if (d <= 3) return "urgent";
  if (d <= 10) return "soon";
  return "later";
}

function assignmentById(assignments, id) {
  for (var i = 0; i < assignments.length; i++) if (assignments[i].id === id) return assignments[i];
  return null;
}

function courseById(courses, id) {
  for (var i = 0; i < courses.length; i++) if (courses[i].id === id) return courses[i];
  return null;
}

function assignmentsForCourse(assignments, courseId) {
  return assignments.filter(function (a) { return a.courseId === courseId; });
}

function openAssignments(assignments) {
  return assignments.filter(function (a) { return a.status !== "submitted" && a.status !== "graded"; });
}

function overdueAssignments(assignments, fromISO) {
  return openAssignments(assignments).filter(function (a) {
    return urgency(fromISO, a.dueDate) === "overdue";
  });
}

function dueWithin(assignments, fromISO, days) {
  return openAssignments(assignments).filter(function (a) {
    var d = daysUntil(fromISO, a.dueDate);
    return d !== null && d >= 0 && d <= days;
  }).sort(function (x, y) { return String(x.dueDate).localeCompare(String(y.dueDate)); });
}

function completionPct(assignments) {
  if (!assignments.length) return null;
  var done = assignments.filter(function (a) {
    return a.status === "submitted" || a.status === "graded";
  }).length;
  return Math.round((done / assignments.length) * 100);
}

function countByStatus(assignments) {
  var out = { "not-started": 0, "in-progress": 0, "submitted": 0, "graded": 0 };
  assignments.forEach(function (a) {
    if (out[a.status] === undefined) out[a.status] = 0;
    out[a.status]++;
  });
  return out;
}

/* Weighted course grade from graded assignments: sum(score/max * weight) / sum(weight) * 100 */
function courseGradePct(assignments, courseId) {
  var list = assignmentsForCourse(assignments, courseId).filter(function (a) {
    return a.status === "graded" && Number(a.maxScore) > 0 && a.score !== "" && a.score !== null && a.score !== undefined;
  });
  if (!list.length) return null;
  var wsum = 0, acc = 0;
  list.forEach(function (a) {
    var w = Number(a.weight) > 0 ? Number(a.weight) : 1;
    acc += (Number(a.score) / Number(a.maxScore)) * w;
    wsum += w;
  });
  if (!wsum) return null;
  return Math.round((acc / wsum) * 1000) / 10;
}

function pctToLetter(pct) {
  if (pct === null || pct === undefined || pct === "") return "";
  var p = Number(pct);
  if (p >= 97) return "A+";
  if (p >= 93) return "A";
  if (p >= 90) return "A-";
  if (p >= 87) return "B+";
  if (p >= 83) return "B";
  if (p >= 80) return "B-";
  if (p >= 77) return "C+";
  if (p >= 73) return "C";
  if (p >= 70) return "C-";
  if (p >= 67) return "D+";
  if (p >= 63) return "D";
  if (p >= 60) return "D-";
  return "F";
}

function gradePoints(letter) {
  var g = GRADE_POINTS[String(letter).toUpperCase()];
  return g === undefined ? null : g;
}

/* GPA across courses that have a letter grade (or a computed one) and credits */
function calcGPA(courses, assignments) {
  var pts = 0, creds = 0;
  courses.forEach(function (c) {
    var credits = Number(c.credits);
    if (!(credits > 0)) return;
    var letter = c.finalGrade;
    if (!letter) {
      var pct = courseGradePct(assignments, c.id);
      if (pct === null) return;
      letter = pctToLetter(pct);
    }
    var gp = gradePoints(letter);
    if (gp === null) return;
    pts += gp * credits;
    creds += credits;
  });
  if (!creds) return null;
  return Math.round((pts / creds) * 100) / 100;
}

function creditsEarned(courses) {
  var t = 0;
  courses.forEach(function (c) {
    if (c.finalGrade && gradePoints(c.finalGrade) !== null && gradePoints(c.finalGrade) > 0) {
      t += Number(c.credits) > 0 ? Number(c.credits) : 0;
    }
  });
  return t;
}

function creditsRemaining(courses, degreeTotalCredits) {
  var need = Number(degreeTotalCredits);
  if (!(need > 0)) return null;
  return Math.max(0, need - creditsEarned(courses));
}

function gpaBySemester(courses, assignments) {
  var groups = {};
  courses.forEach(function (c) {
    var s = c.semester || "Unassigned";
    if (!groups[s]) groups[s] = [];
    groups[s].push(c);
  });
  var out = {};
  Object.keys(groups).forEach(function (s) {
    out[s] = calcGPA(groups[s], assignments);
  });
  return out;
}

function upcomingExams(exams, fromISO, days) {
  return exams.filter(function (e) {
    var d = daysUntil(fromISO, e.date);
    return d !== null && d >= 0 && d <= days;
  }).sort(function (x, y) { return String(x.date).localeCompare(String(y.date)); });
}

function studyHoursLogged(assignments) {
  var t = 0;
  assignments.forEach(function (a) { if (Number(a.hours) > 0) t += Number(a.hours); });
  return Math.round(t * 10) / 10;
}

function timetableForDay(classes, day) {
  return classes.filter(function (c) { return c.day === day; })
    .sort(function (x, y) { return String(x.start).localeCompare(String(y.start)); });
}

function summaryReport(state, todayISO) {
  var a = state.assignments || [], c = state.courses || [], e = state.exams || [];
  return {
    totalAssignments: a.length,
    open: openAssignments(a).length,
    overdue: overdueAssignments(a, todayISO).length,
    dueThisWeek: dueWithin(a, todayISO, 7).length,
    completion: completionPct(a),
    courses: c.length,
    gpa: calcGPA(c, a),
    creditsEarned: creditsEarned(c),
    examsUpcoming: upcomingExams(e, todayISO, 30).length,
    studyHours: studyHoursLogged(a),
    byStatus: countByStatus(a)
  };
}

function toCSV(assignments, courses) {
  var head = ["Title", "Course", "Type", "Due Date", "Status", "Weight %", "Score", "Max Score", "Hours"];
  var lines = [head.join(",")];
  assignments.forEach(function (a) {
    var course = courseById(courses, a.courseId);
    var row = [
      a.title, course ? course.name : "", a.type, a.dueDate, a.status,
      a.weight, a.score, a.maxScore, a.hours
    ].map(function (v) {
      var s = (v === null || v === undefined) ? "" : String(v);
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    });
    lines.push(row.join(","));
  });
  return lines.join("\n");
}

if (typeof module !== "undefined" && module.exports) {
  module.exports = {
    GRADE_POINTS: GRADE_POINTS,
    parseISO: parseISO, toISO: toISO, daysUntil: daysUntil, urgency: urgency,
    assignmentById: assignmentById, courseById: courseById,
    assignmentsForCourse: assignmentsForCourse, openAssignments: openAssignments,
    overdueAssignments: overdueAssignments, dueWithin: dueWithin,
    completionPct: completionPct, countByStatus: countByStatus,
    courseGradePct: courseGradePct, pctToLetter: pctToLetter, gradePoints: gradePoints,
    calcGPA: calcGPA, creditsEarned: creditsEarned, creditsRemaining: creditsRemaining,
    gpaBySemester: gpaBySemester, upcomingExams: upcomingExams,
    studyHoursLogged: studyHoursLogged, timetableForDay: timetableForDay,
    summaryReport: summaryReport, toCSV: toCSV
  };
}
</script>

];

function uid() { return "id" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function esc(s) {

    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function todayISO() { return toISO(new Date()); }

function blank() {

}

function load() {
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) { STATE = JSON.parse(raw); }
  } catch (e) { STATE = null; }
  if (!STATE || !STATE.assignments) STATE = seed();
  if (!STATE.settings) STATE.settings = { dark: "0", degreeCredits: 120, targetGPA: 3.5 };
  if (!STATE.classes) STATE.classes = [];
  if (!STATE.exams) STATE.exams = [];
  document.documentElement.setAttribute("data-dark", STATE.settings.dark === "1" ? "1" : "0");
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(STATE)); } catch (e) { }
}

function el(tag, attrs, html) {
  var a = "";
  if (attrs) for (var k in attrs) if (attrs[k] !== null && attrs[k] !== undefined) a += " " + k + '="' + String(attrs[k]).replace(/"/g, "&quot;") + '"';
  return "<" + tag + a + ">" + (html === undefined ? "" : html) + "</" + tag + ">";
}

function urgPill(dueISO, status) {
  if (status === "submitted") return el("span", { "class": "pill ok" }, "Submitted");
  if (status === "graded") return el("span", { "class": "pill blue" }, "Graded");
  var u = urgency(todayISO(), dueISO);
  var d = daysUntil(todayISO(), dueISO);
  if (u === "overdue") return el("span", { "class": "pill red" }, Math.abs(d) + "d overdue");
  if (u === "due-today") return el("span", { "class": "pill red" }, "Due today");

    el("div", { "class": "grid g2" },
      el("div", { "class": "f" }, el("label", {}, "Due date") + el("input", { id: "fDue", type: "date", value: esc(d.dueDate) })) +
      el("div", { "class": "f" }, el("label", {}, "Status") + el("select", { id: "fStatus" }, opts(STATUSES, d.status)))) +
    el("div", { "class": "grid g3" },
      el("div", { "class": "f" }, el("label", {}, "Weight %") + el("input", { id: "fWeight", type: "number", min: "0", step: "0.5", value: esc(d.weight) })) +
      el("div", { "class": "f" }, el("label", {}, "Score") + el("input", { id: "fScore", type: "number", min: "0", step: "0.5", value: esc(d.score) })) +
      el("div", { "class": "f" }, el("label", {}, "Out of") + el("input", { id: "fMax", type: "number", min: "0", step: "0.5", value: esc(d.maxScore) }))) +
    el("div", { "class": "f" }, el("label", {}, "Study hours logged") + el("input", { id: "fHours", type: "number", min: "0", step: "0.25", value: esc(d.hours) })) +
    el("div", { "class": "f" }, el("label", {}, "Notes") + el("textarea", { id: "fNotes", rows: "2" }, esc(d.notes || ""))) +
    el("div", { "class": "row" }, el("button", { "class": "btn", "data-save-a": "1" }, "Save") +
      el("button", { "class": "btn ghost", "data-close": "1" }, "Cancel")));
}

function modalCourse() {
  var c = EDIT ? courseById(STATE.courses, EDIT) : null;
  var d = c || { name: "", code: "", credits: 3, semester: "", instructor: "", finalGrade: "" };
  return el("div", { "class": "sheet" },
    el("h3", {}, c ? "Edit course" : "New course") +
    el("div", { "class": "grid g2" },
      el("div", { "class": "f" }, el("label", {}, "Course name") + el("input", { id: "cName", value: esc(d.name), placeholder: "e.g. Calculus II" })) +
      el("div", { "class": "f" }, el("label", {}, "Code") + el("input", { id: "cCode", value: esc(d.code), placeholder: "MATH201" }))) +
    el("div", { "class": "grid g3" },
      el("div", { "class": "f" }, el("label", {}, "Credits") + el("input", { id: "cCredits", type: "number", min: "0", step: "0.5", value: esc(d.credits) })) +
      el("div", { "class": "f" }, el("label", {}, "Semester") + el("input", { id: "cSem", value: esc(d.semester), placeholder: "Fall 2026" })) +
      el("div", { "class": "f" }, el("label", {}, "Final grade") + el("select", { id: "cGrade" }, opts(LETTERS, d.finalGrade)))) +
    el("div", { "class": "f" }, el("label", {}, "Instructor") + el("input", { id: "cInstr", value: esc(d.instructor || "") })) +
    el("div", { "class": "note", style: "margin-bottom:12px" }, "Leave final grade blank while the course is running — the app projects it from your graded work.") +
    el("div", { "class": "row" }, el("button", { "class": "btn", "data-save-c": "1" }, "Save") +
      el("button", { "class": "btn ghost", "data-close": "1" }, "Cancel")));
}

function modalClass() {
  return el("div", { "class": "sheet" },
    el("h3", {}, "Add class to timetable") +
    el("div", { "class": "f" }, el("label", {}, "Course") + el("select", { id: "tCourse" }, courseOpts(""))) +
    el("div", { "class": "grid g3" },
      el("div", { "class": "f" }, el("label", {}, "Day") + el("select", { id: "tDay" }, opts(DAYS, "Mon"))) +
      el("div", { "class": "f" }, el("label", {}, "Start") + el("input", { id: "tStart", type: "time", value: "09:00" })) +
      el("div", { "class": "f" }, el("label", {}, "End") + el("input", { id: "tEnd", type: "time", value: "10:30" }))) +
    el("div", { "class": "f" }, el("label", {}, "Room") + el("input", { id: "tRoom", placeholder: "e.g. Maths A1" })) +
    el("div", { "class": "row" }, el("button", { "class": "btn", "data-save-t": "1" }, "Add") +
      el("button", { "class": "btn ghost", "data-close": "1" }, "Cancel")));
}

function modalExam() {
  var e = EDIT ? (function () { for (var i = 0; i < STATE.exams.length; i++) if (STATE.exams[i].id === EDIT) return STATE.exams[i]; return null; })() : null;
  var d = e || { title: "", courseId: STATE.courses.length ? STATE.courses[0].id : "", date: todayISO(), start: "09:00", location: "", weight: "", notes: "" };
  return el("div", { "class": "sheet" },
    el("h3", {}, e ? "Edit exam" : "New exam") +
    el("div", { "class": "f" }, el("label", {}, "Exam title") + el("input", { id: "eTitle", value: esc(d.title), placeholder: "e.g. Calculus II Midterm" })) +
    el("div", { "class": "grid g2" },
      el("div", { "class": "f" }, el("label", {}, "Course") + el("select", { id: "eCourse" }, courseOpts(d.courseId))) +
      el("div", { "class": "f" }, el("label", {}, "Weight % of grade") + el("input", { id: "eWeight", type: "number", min: "0", step: "1", value: esc(d.weight) }))) +
    el("div", { "class": "grid g3" },
      el("div", { "class": "f" }, el("label", {}, "Date") + el("input", { id: "eDate", type: "date", value: esc(d.date) })) +
      el("div", { "class": "f" }, el("label", {}, "Start time") + el("input", { id: "eStart", type: "time", value: esc(d.start || "09:00") })) +
      el("div", { "class": "f" }, el("label", {}, "Location") + el("input", { id: "eLoc", value: esc(d.location || "") }))) +
    el("div", { "class": "f" }, el("label", {}, "Revision notes") + el("textarea", { id: "eNotes", rows: "2" }, esc(d.notes || ""))) +
    el("div", { "class": "row" }, el("button", { "class": "btn", "data-save-e": "1" }, "Save") +
      el("button", { "class": "btn ghost", "data-close": "1" }, "Cancel")));
}

/* ---------- render ---------- */

function render() {
  var body =
    VIEW === "dash" ? viewDash() :
      VIEW === "assignments" ? viewAssignments() :
        VIEW === "courses" ? viewCourses() :
          VIEW === "timetable" ? viewTimetable() :
            VIEW === "exams" ? viewExams() :
              VIEW === "grades" ? viewGrades() :
                VIEW === "degree" ? viewDegree() :
                  VIEW === "reports" ? viewReports() : "";

  var tabs = TABS.map(function (t) {
    return el("button", { "class": "tab" + (VIEW === t[0] ? " on" : ""), "data-tab": t[0] }, t[1]);
  }).join("");

  var modal = "";
  if (MODAL === "assignment") modal = el("div", { "class": "modal", "data-modal": "1" }, modalAssignment());
  if (MODAL === "course") modal = el("div", { "class": "modal", "data-modal": "1" }, modalCourse());
  if (MODAL === "class") modal = el("div", { "class": "modal", "data-modal": "1" }, modalClass());
  if (MODAL === "exam") modal = el("div", { "class": "modal", "data-modal": "1" }, modalExam());

  document.getElementById("app").innerHTML =
    el("div", { "class": "top" },
      el("div", { "class": "brand" }, el("span", { "class": "dot" }) +
        el("span", {}, "Assignment &amp; Study Tracker" + el("small", {}, "LEDGERLOOPSTUDIO"))) +
      el("div", { "class": "tabs" }, tabs +
        el("button", { "class": "tab", "data-dark": "1" }, STATE.settings.dark === "1" ? "☀ Light" : "☾ Dark"))) +
    el("div", { "class": "wrap" }, body +
      el("div", { "class": "foot" }, "Works offline · no account · no subscription · your data stays in this browser")) +
    modal;
}

function val(id) { var e = document.getElementById(id); return e ? e.value : ""; }
function num(id) { var v = val(id); return v === "" ? "" : Number(v); }

function download(name, text, mime) {
  var b = new Blob([text], { type: mime || "text/plain;charset=utf-8" });
  var u = URL.createObjectURL(b), a = document.createElement("a");
  a.href = u; a.download = name; document.body.appendChild(a); a.click();
  document.body.removeChild(a); setTimeout(function () { URL.revokeObjectURL(u); }, 1200);
}

document.addEventListener("click", function (ev) {
  var t = ev.target;
  if (!(t && t.getAttribute)) return;
  var g = function (k) { return t.getAttribute(k); };

  if (g("data-tab")) { VIEW = g("data-tab"); MODAL = null; EDIT = null; render(); return; }
  if (g("data-dark")) { STATE.settings.dark = STATE.settings.dark === "1" ? "0" : "1"; document.documentElement.setAttribute("data-dark", STATE.settings.dark); save(); render(); return; }
  if (g("data-close") || (g("data-modal") && t.className === "modal")) { MODAL = null; EDIT = null; render(); return; }

  if (g("data-new-a")) {
    if (!STATE.courses.length) { alert("Add a course first, then link assignments to it."); return; }
    MODAL = "assignment"; EDIT = null; render(); return;
  }
  if (g("data-edit-a")) { MODAL = "assignment"; EDIT = g("data-edit-a"); render(); return; }
  if (g("data-del-a")) {
    var ida = g("data-del-a");
    if (confirm("Delete this assignment?")) {
      STATE.assignments = STATE.assignments.filter(function (a) { return a.id !== ida; });
      save(); render();
    } return;
  }
  if (g("data-save-a")) {
    var title = val("fTitle").trim();
    if (!title) { alert("Give the assignment a title."); return; }
    var rec = {
      id: EDIT || uid(), courseId: val("fCourse"), title: title, type: val("fType"),
      dueDate: val("fDue"), status: val("fStatus"), weight: num("fWeight"),
      score: num("fScore"), maxScore: num("fMax"), hours: num("fHours"), notes: val("fNotes")
    };
    if (EDIT) {
      STATE.assignments = STATE.assignments.map(function (a) { return a.id === EDIT ? rec : a; });
    } else { if(demoLimitReached()) return; STATE.assignments.push(rec); }
    MODAL = null; EDIT = null; save(); render(); return;
  }

  if (g("data-new-c")) { MODAL = "course"; EDIT = null; render(); return; }
  if (g("data-edit-c")) { MODAL = "course"; EDIT = g("data-edit-c"); render(); return; }
  if (g("data-del-c")) {
    var idc = g("data-del-c");
    var n = assignmentsForCourse(STATE.assignments, idc).length;
    if (confirm(n ? "Delete this course? " + n + " linked assignment(s) will keep their data but lose the course link." : "Delete this course?")) {
      STATE.courses = STATE.courses.filter(function (c) { return c.id !== idc; });
      STATE.classes = STATE.classes.filter(function (c) { return c.courseId !== idc; });
      save(); render();
    } return;
  }
  if (g("data-save-c")) {
    var nm = val("cName").trim();
    if (!nm) { alert("Give the course a name."); return; }
    var recc = {
      id: EDIT || uid(), name: nm, code: val("cCode"), credits: num("cCredits"),
      semester: val("cSem"), instructor: val("cInstr"), finalGrade: val("cGrade")
    };
    if (EDIT) { STATE.courses = STATE.courses.map(function (c) { return c.id === EDIT ? recc : c; }); }
    else { STATE.courses.push(recc); }
    MODAL = null; EDIT = null; save(); render(); return;
  }

  if (g("data-new-t")) {
    if (!STATE.courses.length) { alert("Add a course first."); return; }
    MODAL = "class"; render(); return;
  }
  if (g("data-save-t")) {
    STATE.classes.push({
      id: uid(), courseId: val("tCourse"), day: val("tDay"),
      start: val("tStart"), end: val("tEnd"), room: val("tRoom")
    });
    MODAL = null; save(); render(); return;
  }
  if (g("data-del-t")) {
    var idt = g("data-del-t");
    STATE.classes = STATE.classes.filter(function (c) { return c.id !== idt; });
    save(); render(); return;
  }

  if (g("data-new-e")) {
    if (!STATE.courses.length) { alert("Add a course first."); return; }
    MODAL = "exam"; EDIT = null; render(); return;
  }
  if (g("data-edit-e")) { MODAL = "exam"; EDIT = g("data-edit-e"); render(); return; }
  if (g("data-del-e")) {
    var ide = g("data-del-e");
    if (confirm("Delete this exam?")) {
      STATE.exams = STATE.exams.filter(function (x) { return x.id !== ide; });
      save(); render();
    } return;
  }
  if (g("data-save-e")) {
    var et = val("eTitle").trim();
    if (!et) { alert("Give the exam a title."); return; }
    var rece = {
      id: EDIT || uid(), courseId: val("eCourse"), title: et, date: val("eDate"),
      start: val("eStart"), location: val("eLoc"), weight: num("eWeight"), notes: val("eNotes")
    };
    if (EDIT) { STATE.exams = STATE.exams.map(function (x) { return x.id === EDIT ? rece : x; }); }
    else { STATE.exams.push(rece); }
    MODAL = null; EDIT = null; save(); render(); return;
  }

  if (g("data-save-plan")) {
    STATE.settings.degreeCredits = num("setCredits") || 0;
    STATE.settings.targetGPA = num("setGpa") || 0;
    save(); render(); return;
  }

  if (g("data-csv")) { download("assignments.csv", toCSV(STATE.assignments, STATE.courses), "text/csv;charset=utf-8"); return; }
  if (g("data-backup")) { download("assignment-tracker-backup.json", JSON.stringify(STATE, null, 2), "application/json"); return; }
  if (g("data-restore")) { var f = document.getElementById("restoreFile"); if (f) f.click(); return; }
  if (g("data-print")) { window.print(); return; }
  if (g("data-reset")) {
    if (confirm("Clear ALL data in this browser? Export a backup first if you might want it back.")) {
      STATE = blank(); save(); VIEW = "dash"; render();
    } return;
  }
});

document.addEventListener("change", function (ev) {
  if (ev.target && ev.target.id === "restoreFile") {
    var file = ev.target.files && ev.target.files[0];
    if (!file) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var obj = JSON.parse(r.result);
        if (!obj || !obj.assignments) throw new Error("bad");
        STATE = obj;
        if (!STATE.settings) STATE.settings = { dark: "0", degreeCredits: 120, targetGPA: 3.5 };
        if (!STATE.classes) STATE.classes = [];
        if (!STATE.exams) STATE.exams = [];
        document.documentElement.setAttribute("data-dark", STATE.settings.dark === "1" ? "1" : "0");
        save(); render();
        alert("Backup restored.");
      } catch (e) { alert("That file could not be read as a backup."); }
    };
    r.readAsText(file);
  }
});

load();
render();
</script>
</body></html>
